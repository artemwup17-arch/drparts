<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>DrParts — керування товарами</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#f5f6f8;color:#1c2230;line-height:1.45}
  .wrap{width:min(900px,94%);margin:0 auto;padding:24px 0 80px}
  h1{font-size:1.5rem;margin-bottom:16px}
  .panel{background:#fff;border-radius:14px;padding:22px;box-shadow:0 2px 10px rgba(0,0,0,.06);margin-bottom:16px}
  label{display:block;font-weight:600;font-size:.9rem;margin:12px 0 4px}
  input,select,textarea{width:100%;padding:11px 12px;border:1px solid #d0d5e0;border-radius:9px;font-size:1rem;background:#fff;font-family:inherit}
  textarea{min-height:90px;resize:vertical}
  button{cursor:pointer;border:0;border-radius:9px;padding:11px 18px;font-size:1rem;font-weight:700;background:#e8501a;color:#fff}
  button:hover{background:#c43f10}
  button.sec{background:#e3e6ee;color:#1c2230}
  button.sec:hover{background:#d3d7e3}
  button.danger{background:#fff;color:#c62828;border:1px solid #e0b4b4}
  button.danger:hover{background:#fdeaea}
  button:disabled{opacity:.5;cursor:not-allowed}
  .bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;position:sticky;top:0;background:#f5f6f8;padding:10px 0;z-index:5}
  .bar .sp{flex:1}
  .item{display:flex;gap:14px;align-items:center;background:#fff;border-radius:12px;padding:12px;margin-bottom:10px;box-shadow:0 1px 6px rgba(0,0,0,.05)}
  .thumb{width:72px;height:54px;border-radius:8px;background:#dfe3ec;object-fit:cover;flex:none;display:flex;align-items:center;justify-content:center;font-size:1.4rem}
  .meta{flex:1;min-width:0}
  .meta b{display:block;font-size:.95rem}
  .meta small{color:#6b7385}
  .btns{display:flex;gap:6px;flex-wrap:wrap}
  .btns button{padding:8px 12px;font-size:.85rem}
  #status{font-size:.9rem;font-weight:600}
  .ok{color:#1b7a3a}
  .err{color:#c62828}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-start;justify-content:center;padding:20px;overflow:auto;z-index:10}
  .box{background:#fff;border-radius:14px;padding:22px;width:min(560px,100%);margin:auto}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .hint{font-size:.85rem;color:#6b7385;margin-top:6px}
  .ph-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin-top:10px}
  .ph{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#e3e6ee}
  .ph img{width:100%;height:100%;object-fit:cover}
  .ph .x,.ph .st{position:absolute;border-radius:50%;width:26px;height:26px;padding:0;font-size:.9rem;line-height:26px;text-align:center}
  .ph .x{top:4px;right:4px;background:rgba(0,0,0,.7)}
  .ph .st{top:4px;left:4px;background:rgba(0,0,0,.7)}
  .ph .main{position:absolute;left:0;right:0;bottom:0;background:var(--a,#e8501a);background:#e8501a;color:#fff;font-size:.7rem;text-align:center;padding:2px}
  .addph{display:flex;align-items:center;justify-content:center;aspect-ratio:1;border:2px dashed #b9c0d0;border-radius:10px;color:#6b7385;font-size:1.8rem;cursor:pointer}
  .addph:hover{border-color:#e8501a;color:#e8501a}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <h1>DrParts — керування товарами</h1>

  <div id="setup" class="panel" hidden>
    <b>База даних ще не підключена.</b>
    <p class="hint">Відкрийте файл <code>config.js</code> і вставте адресу та ключ з Supabase (інструкція в чаті), потім оновіть сторінку.</p>
  </div>

  <div id="login" class="panel" hidden>
    <p>Увійдіть, щоб додавати й змінювати товари.</p>
    <label for="email">Електронна пошта</label>
    <input id="email" type="email" autocomplete="username">
    <label for="pass">Пароль</label>
    <input id="pass" type="password" autocomplete="current-password">
    <p style="margin-top:14px"><button id="loginBtn">Увійти</button></p>
    <p id="loginMsg" class="err" style="margin-top:10px"></p>
  </div>

  <div id="app" hidden>
    <div class="bar">
      <button id="addBtn">+ Додати товар</button>
      <a href="index.html" style="text-decoration:none"><button class="sec" type="button">На сайт</button></a>
      <span id="status"></span>
      <span class="sp"></span>
      <button id="logoutBtn" class="sec">Вийти</button>
    </div>
    <div id="list"></div>
  </div>
</div>

<div class="modal" id="modal" hidden>
  <div class="box">
    <h2 id="mTitle">Новий товар</h2>
    <label for="fName">Назва</label>
    <input id="fName" placeholder="Наприклад: Бампер Subaru Outback 2023">
    <div class="row2">
      <div><label for="fPrice">Ціна, грн</label><input id="fPrice" type="number" min="0" inputmode="numeric"></div>
      <div><label for="fCity">Місто / район</label><input id="fCity" list="cities"></div>
    </div>
    <datalist id="cities"><option>Київ, Голосіївський</option><option>Київ, Шевченківський</option><option>Чабани</option></datalist>
    <label for="fDesc">Опис (необов'язково)</label>
    <textarea id="fDesc" placeholder="Стан, сумісність, комплектація..."></textarea>
    <label for="fUrl">Посилання на оголошення OLX (необов'язково)</label>
    <input id="fUrl" type="url" placeholder="https://www.olx.ua/d/...">
    <label>Фото</label>
    <div class="ph-grid" id="phGrid"></div>
    <input id="fFile" type="file" accept="image/*" multiple hidden>
    <p class="hint">Перше фото — головне. Фото автоматично зменшуються.</p>
    <p id="mMsg" class="err" style="margin-top:10px"></p>
    <p style="margin-top:14px;display:flex;gap:10px"><button id="mOk">Зберегти</button><button id="mCancel" class="sec">Скасувати</button></p>
  </div>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const cfg = window.DRPARTS || {};
  const configured = !!(cfg.SUPABASE_URL && cfg.SUPABASE_ANON_KEY && window.supabase);
  let sb = null, products = [], editId = null, formPhotos = [];

  function status(t, cls){ const s = $("#status"); s.textContent = t || ""; s.className = cls || ""; }
  const firstPhoto = p => (Array.isArray(p.images) && p.images[0]) || "";

  function show(logged){
    $("#login").hidden = logged;
    $("#app").hidden = !logged;
  }

  async function loadList(){
    const { data, error } = await sb.from("products").select("*").order("id", { ascending: false });
    if (error){ status("Не вдалося завантажити: " + error.message, "err"); return; }
    products = data || [];
    renderList();
  }

  function renderList(){
    const L = $("#list");
    if (!products.length){ L.innerHTML = '<div class="panel">Товарів ще немає. Натисніть «+ Додати товар».</div>'; return; }
    L.innerHTML = products.map(p => `
      <div class="item">
        ${firstPhoto(p) ? `<img class="thumb" src="${esc(firstPhoto(p))}" alt="" referrerpolicy="no-referrer">` : `<div class="thumb">⚙️</div>`}
        <div class="meta">
          <b>${esc(p.name)}</b>
          <small>${Number(p.price || 0).toLocaleString("uk-UA")} грн · ${esc(p.city)}${(p.images||[]).length ? " · 📷 " + p.images.length : ""}</small>
        </div>
        <div class="btns">
          <button class="sec" data-e="${p.id}">Змінити</button>
          <button class="danger" data-d="${p.id}">Видалити</button>
        </div>
      </div>`).join("");
  }

  // ===== Форма =====
  function renderPhotos(){
    const g = $("#phGrid");
    g.innerHTML = formPhotos.map((ph, i) => `
      <div class="ph">
        <img src="${esc(ph.preview || ph.url)}" alt="" referrerpolicy="no-referrer">
        <button class="x" data-rm="${i}" type="button" title="Прибрати">✕</button>
        ${i > 0 ? `<button class="st" data-main="${i}" type="button" title="Зробити головним">★</button>` : ""}
        ${i === 0 ? '<div class="main">головне</div>' : ""}
      </div>`).join("") + '<label class="addph" for="fFile" title="Додати фото">+</label>';
  }

  function openForm(id){
    editId = id;
    const p = products.find(x => x.id === id) || { name:"", price:"", city:"", description:"", url:"", images:[] };
    $("#mTitle").textContent = id ? "Змінити товар" : "Новий товар";
    $("#fName").value = p.name;
    $("#fPrice").value = p.price;
    $("#fCity").value = p.city || "";
    $("#fDesc").value = p.description || "";
    $("#fUrl").value = p.url || "";
    formPhotos = (p.images || []).filter(Boolean).map(u => ({ url: u }));
    $("#fFile").value = "";
    $("#mMsg").textContent = "";
    $("#mOk").disabled = false;
    renderPhotos();
    $("#modal").hidden = false;
  }

  function resize(file, max = 1200){
    return new Promise((res, rej) => {
      const img = new Image();
      const u = URL.createObjectURL(file);
      img.onload = () => {
        const k = Math.min(1, max / Math.max(img.width, img.height));
        const w = Math.round(img.width * k), h = Math.round(img.height * k);
        const c = document.createElement("canvas");
        c.width = w; c.height = h;
        c.getContext("2d").drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(u);
        c.toBlob(b => b ? res(b) : rej(new Error("toBlob")), "image/jpeg", 0.82);
      };
      img.onerror = () => rej(new Error("image"));
      img.src = u;
    });
  }

  $("#fFile").addEventListener("change", async e => {
    const files = [...e.target.files];
    $("#mMsg").textContent = "";
    for (const f of files){
      try{
        const blob = await resize(f);
        formPhotos.push({ blob, preview: URL.createObjectURL(blob) });
      }catch(err){ $("#mMsg").textContent = "Не вдалося прочитати одне з фото."; }
    }
    e.target.value = "";
    renderPhotos();
  });

  $("#phGrid").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.rm !== undefined) formPhotos.splice(Number(b.dataset.rm), 1);
    if (b.dataset.main !== undefined){ const [x] = formPhotos.splice(Number(b.dataset.main), 1); formPhotos.unshift(x); }
    renderPhotos();
  });

  async function saveForm(){
    const name = $("#fName").value.trim();
    const priceRaw = $("#fPrice").value;
    if (!name){ $("#mMsg").textContent = "Вкажіть назву."; return; }
    if (priceRaw === "" || Number(priceRaw) < 0){ $("#mMsg").textContent = "Вкажіть ціну."; return; }
    $("#mOk").disabled = true;
    $("#mMsg").className = ""; $("#mMsg").textContent = "Зберігаю…";
    try{
      const urls = [];
      for (const ph of formPhotos){
        if (ph.url){ urls.push(ph.url); continue; }
        const path = Date.now() + "-" + Math.random().toString(36).slice(2, 8) + ".jpg";
        const up = await sb.storage.from("photos").upload(path, ph.blob, { contentType: "image/jpeg" });
        if (up.error) throw new Error("Фото: " + up.error.message);
        urls.push(sb.storage.from("photos").getPublicUrl(path).data.publicUrl);
      }
      const payload = {
        name,
        price: Math.round(Number(priceRaw)),
        city: $("#fCity").value.trim(),
        description: $("#fDesc").value.trim(),
        url: $("#fUrl").value.trim(),
        images: urls
      };
      const r = editId
        ? await sb.from("products").update(payload).eq("id", editId)
        : await sb.from("products").insert(payload);
      if (r.error) throw new Error(r.error.message);
      $("#modal").hidden = true;
      status("Збережено! Зміни вже на сайті.", "ok");
      await loadList();
    }catch(e){
      $("#mMsg").className = "err";
      $("#mMsg").textContent = e.message || "Помилка збереження.";
      $("#mOk").disabled = false;
    }
  }

  // ===== Події =====
  $("#addBtn").onclick = () => openForm(null);
  $("#mCancel").onclick = () => { $("#modal").hidden = true; };
  $("#mOk").onclick = saveForm;

  $("#list").addEventListener("click", async e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.e) openForm(Number(b.dataset.e));
    if (b.dataset.d){
      const p = products.find(x => x.id === Number(b.dataset.d));
      if (p && confirm("Видалити «" + p.name + "»?")){
        const { error } = await sb.from("products").delete().eq("id", p.id);
        if (error) status("Не вдалося видалити: " + error.message, "err");
        else { status("Видалено.", "ok"); await loadList(); }
      }
    }
  });

  async function login(){
    $("#loginMsg").textContent = "";
    $("#loginBtn").disabled = true;
    const { error } = await sb.auth.signInWithPassword({ email: $("#email").value.trim(), password: $("#pass").value });
    $("#loginBtn").disabled = false;
    if (error){ $("#loginMsg").textContent = "Невірна пошта або пароль."; return; }
    show(true); status(""); loadList();
  }
  $("#loginBtn").onclick = login;
  $("#pass").addEventListener("keydown", e => { if (e.key === "Enter") login(); });
  $("#logoutBtn").onclick = async () => { await sb.auth.signOut(); show(false); };

  (async () => {
    if (!configured){ $("#setup").hidden = false; return; }
    sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
    const { data } = await sb.auth.getSession();
    if (data && data.session){ show(true); loadList(); } else show(false);
  })();
</script>
</body>
</html>
